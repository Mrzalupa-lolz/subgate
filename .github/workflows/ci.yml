name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Unit and integration tests with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Panel generation and schema drift
        run: python3 scripts/generate-panel.py --check
      - name: Installer syntax and help
        run: |
          bash -n deploy/install.sh
          bash deploy/install.sh --help
          bash -n deploy/install-agent.sh
          bash deploy/install-agent.sh --help
          bash scripts/test-agent-installer.sh
      - name: Build static Linux binaries
        run: make build
      - name: Check executable versions
        run: |
          ./bin/subgate-core -version
          ./bin/subgate-agent -version
      - name: Isolated executable smoke test
        run: python3 scripts/validate-linux.py --bin-dir bin --stats-address 127.0.0.1:1
      - uses: actions/upload-artifact@v4
        with:
          name: subgate-linux-amd64
          path: bin/subgate-*
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [core, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          push: false
          tags: subgate-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
